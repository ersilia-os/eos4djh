Identifier: eos4djh
Slug: datamol-basic-descriptors
Status: Ready
Title: Basic molecular descriptors from Datamol
Description: Calculates 22 everyday molecular descriptors with Datamol, covering
  weight, calculated lipophilicity, hydrogen bond donors and acceptors, ring and
  heteroatom counts, rotatable bonds, topological polar surface area, 
  drug-likeness and a synthetic accessibility estimate. The set is deliberately 
  small and interpretable, intended for annotating compound collections or as a 
  cheap baseline feature vector. All values follow deterministically from the 
  structure, so results are exact and reproducible rather than predicted.
